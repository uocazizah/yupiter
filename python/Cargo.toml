[package]
name = "yupiter"
version = "2.0.0"
edition = "2021"
license = "GPL-2.0-or-later OR LGPL-2.1-or-later OR Apache-2.0"

[lib]
name = "yupiter"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312", "extension-module"] }

[profile.release]
opt-level = 3
lto = true
